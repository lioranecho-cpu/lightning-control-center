<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LCC — Sign In</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0a0e14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: #12161f; border: 1px solid #232838; border-radius: 12px;
    padding: 40px; width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .card h1 { color: #fff; font-size: 20px; margin: 0 0 4px; text-align: center; }
  .card p.sub { color: #7d8590; font-size: 13px; margin: 0 0 24px; text-align: center; }
  input[type="password"] {
    width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 8px;
    border: 1px solid #232838; background: #0a0e14; color: #fff; font-size: 14px; margin-bottom: 12px;
  }
  input[type="password"]:focus { outline: none; border-color: #f7931a; }
  button {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: #f7931a; color: #0a0e14; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #ffa733; }
  .error { color: #ef4444; font-size: 13px; margin-top: 12px; text-align: center; display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>⚡ Lightning Control Center</h1>
    <p class="sub">Sign in to continue</p>
    <form id="loginForm">
      <input type="password" id="password" placeholder="Password" autofocus required>
      <button type="submit">Sign In</button>
      <div class="error" id="errorMsg">Incorrect password</div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var pw = document.getElementById('password').value;
      var errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';
      fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: pw})
      }).then(function(r) {
        if (r.ok) {
          window.location.href = '/dashboard';
        } else {
          errEl.style.display = 'block';
        }
      }).catch(function() {
        errEl.style.display = 'block';
      });
    });
  </script>

<!-- Nostr login (NIP-07) -->
<script>
(function(){
  function waitForNostr(ms){return new Promise(function(res){var t=0;(function c(){if(window.nostr)return res(true);t+=100;if(t>=ms)return res(false);setTimeout(c,100);})();});}
  fetch('/api/nostr/status').then(function(r){return r.json();}).then(function(s){
    if(!s.enabled) return;
    var anchor=document.querySelector('form button[type="submit"]')||document.querySelector('form button')||document.querySelector('button');
    if(!anchor) return;
    var btn=document.createElement('button');
    btn.type='button';btn.id='nostr-login-btn';btn.className=anchor.className;
    btn.textContent='\u26A1 Sign in with Nostr';
    btn.style.cssText='margin-top:12px;width:100%;background:transparent;border:1px solid #8e44ad;color:#c39bd3;';
    var msg=document.createElement('div');
    msg.style.cssText='margin-top:8px;font-size:13px;color:#e74c3c;text-align:center;';
    anchor.parentNode.insertBefore(msg,anchor.nextSibling);
    anchor.parentNode.insertBefore(btn,anchor.nextSibling);
    btn.addEventListener('click',async function(){
      msg.textContent='';
      if(!(await waitForNostr(1500))){msg.textContent='No Nostr extension found. Install Alby or nos2x, then reload this page.';return;}
      btn.disabled=true;
      try{
        var c=await (await fetch('/api/nostr/challenge')).json();
        var ev=await window.nostr.signEvent({kind:22242,created_at:Math.floor(Date.now()/1000),tags:[['challenge',c.challenge]],content:''});
        var r=await fetch('/api/nostr/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:ev})});
        if(r.ok){window.location.href='/dashboard';}
        else{var d=await r.json().catch(function(){return {};});msg.textContent=d.detail||'Nostr sign-in failed.';}
      }catch(e){msg.textContent='Signing was cancelled or failed.';}
      finally{btn.disabled=false;}
    });
  }).catch(function(){});
})();
</script>
</body>
</html>
